<script>
/* ==========================================================
   EDIT: board members. Add, remove, or reorder freely.
   photo: "images/jane.jpg" (or leave "" to show initials)
   bio and linkedin are optional; leave "" to hide them.
   ========================================================== */
const BOARD = [
  { name:"Kelly Liu",         role:"President",              bio:"", photo:"images/kelly-liu.jpg",        linkedin:"https://www.linkedin.com/in/kellyliu031/" },
  { name:"Katherine Chen",    role:"Director of Education",  bio:"", photo:"images/katherine-chen.jpg",   linkedin:"" },
  { name:"Aina Matsumoto",    role:"Director of Outreach",   bio:"", photo:"images/aina-matsumoto.jpg",   linkedin:"https://www.linkedin.com/in/ainamatsumoto/" },
  { name:"Victoria Huynh",    role:"Director of Outreach",   bio:"", photo:"images/victoria-huynh.jpg",   linkedin:"https://www.linkedin.com/in/victoriahuynh1/" }
];
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ini = n => n.split(/\s+/).map(w => w[0]).slice(0,2).join("").toUpperCase();
const LI = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 1 1 0-4.125 2.062 2.062 0 0 1 0 4.125zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0z"/></svg>';
document.getElementById("boardGrid").innerHTML = BOARD.map(m => `
  <div class="member${m.linkedin ? " has-li" : ""}" tabindex="0" role="button" aria-label="${esc(m.name)}, ${esc(m.role)}">
    <div class="ph">${m.photo ? `<img src="${esc(m.photo)}" alt="${esc(m.name)}">` : `<span class="mono">${esc(ini(m.name))}</span>`}</div>
    <div class="label"><b>${esc(m.name)}</b><span>${esc(m.role)}</span></div>
    <div class="bio"><b>${esc(m.name)}</b><span class="role">${esc(m.role)}</span>
      ${m.bio ? `<p>${esc(m.bio)}</p>` : ""}
    </div>
    ${m.linkedin ? `<a class="li" href="${esc(m.linkedin)}" target="_blank" rel="noopener" aria-label="${esc(m.name)} on LinkedIn">${LI}</a>` : ""}
  </div>`).join("");
</script>

<script>
/* ==========================================================
   EDIT: board members. Add, remove, or reorder freely.
   photo: "images/jane.jpg" (or leave "" to show initials)
   bio and linkedin are optional; leave "" to hide them.
   ========================================================== */
const BOARD = [
  { name:"Kelly Liu",         role:"President",              bio:"", photo:"images/kelly-liu.jpg",        linkedin:"" },
  { name:"Katherine Chen",    role:"Director of Education",  bio:"", photo:"images/katherine-chen.jpg",   linkedin:"" },
  { name:"Aina Matsumoto",    role:"Director of Outreach",   bio:"", photo:"images/aina-matsumoto.jpg",   linkedin:"" },
  { name:"Victoria Huynh",    role:"Director of Outreach",   bio:"", photo:"images/victoria-huynh.jpg",   linkedin:"" }
];
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ini = n => n.split(/\s+/).map(w => w[0]).slice(0,2).join("").toUpperCase();
document.getElementById("boardGrid").innerHTML = BOARD.map(m => `
  <div class="member" tabindex="0" role="button" aria-label="${esc(m.name)}, ${esc(m.role)}">
    <div class="ph">${m.photo ? `<img src="${esc(m.photo)}" alt="${esc(m.name)}">` : `<span class="mono">${esc(ini(m.name))}</span>`}</div>
    <div class="label"><b>${esc(m.name)}</b><span>${esc(m.role)}</span></div>
    <div class="bio"><b>${esc(m.name)}</b><span class="role">${esc(m.role)}</span>
      ${m.bio ? `<p>${esc(m.bio)}</p>` : ""}
      ${m.linkedin ? `<a href="${esc(m.linkedin)}" target="_blank" rel="noopener">LinkedIn</a>` : ""}
    </div>
  </div>`).join("");
</script>
